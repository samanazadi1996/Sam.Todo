spring.application.name=todo

# ===================== SQL Server =====================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TodoDb;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Sam@12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# ===================== Swagger / OpenAPI =====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===================== JWT =====================
# Base64 of a 256-bit random key (HS256). Override with the JWT_SECRET env variable in production.
app.jwt.secret=${JWT_SECRET:e9NKIQaWvzxU9mD1yuy2PZVwe13xlryx6jeruMJs8bo=}
app.jwt.expiration-ms=3600000

# ===================== Bootstrap Admin =====================
# Created on startup only when the username below does not exist yet (idempotent).
# Override with the BOOTSTRAP_ADMIN_USERNAME / BOOTSTRAP_ADMIN_PASSWORD env variables,
# or leave both blank to skip seeding.
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Sam@12345}
